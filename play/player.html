<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play demo - Neo Retro Games</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .player-wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
    #game { width: 100%; aspect-ratio: 10 / 9; max-height: 80vh; background: #000; border: 2px solid var(--line); }
    #msg { color: var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <h1><a href="../" class="home"><img src="../img/header.png" alt="Neo Retro - neoretro.games"></a></h1>
  </header>

  <main class="player-wrap">
    <p><a id="back" href="../">&larr; All games</a></p>
    <h2 id="title">Demo</h2>
    <p id="msg">Loading...</p>
    <div id="game"></div>
  </main>

  <script>
    // Usage: play/player.html?id=<game-id>. The game's entry in ../games.json needs:
    //   "demo": { "system": "gb" | "gba" | "segaGG" | ..., "rom": "play/<id>/<file>" }
    // "gb" also runs GBC ROMs. ROM path is relative to the site root.
    (function () {
      "use strict";
      var msg = document.getElementById("msg");
      var box = document.getElementById("game");
      var id = new URLSearchParams(location.search).get("id");

      function fail(text) { msg.textContent = text; box.hidden = true; }

      fetch("../games.json")
        .then(function (r) { if (!r.ok) throw new Error("games.json " + r.status); return r.json(); })
        .then(function (data) {
          var g = (data.games || []).filter(function (x) { return x.id === id; })[0];
          if (!g) return fail("Game not found.");
          document.title = g.title + " demo - Neo Retro Games";
          document.getElementById("title").textContent = g.title + " (demo)";
          document.getElementById("back").href = "../game.html?id=" + encodeURIComponent(g.id);
          var d = g.demo;
          if (!d || !/^[A-Za-z0-9_.\/-]+$/.test(d.rom || "") || !/^[A-Za-z0-9_]+$/.test(d.system || "")) {
            return fail("The demo for this game isn't available yet.");
          }
          msg.hidden = true;
          window.EJS_player = "#game";
          window.EJS_core = d.system;
          window.EJS_gameName = g.title;
          window.EJS_gameUrl = new URL("../" + d.rom, location.href).href;
          window.EJS_pathtodata = "emulatorjs/data/";
          window.EJS_startOnLoaded = true;
          var s = document.createElement("script");
          s.src = "emulatorjs/data/loader.js";
          document.body.appendChild(s);
        })
        .catch(function (e) { fail("Could not load the demo (" + e.message + ")."); });
    })();
  </script>
</body>
</html>
